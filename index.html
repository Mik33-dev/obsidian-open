<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Open in Obsidian</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #1a1a1a; --muted: #6b6b6b; --accent: #6c4fd8; --on-accent: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1e1e1e; --fg: #e6e6e6; --muted: #a0a0a0; --accent: #a88bfa; --on-accent: #1e1e1e; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 420px; margin: 0 auto; padding: 18vh 16px 0; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { margin: 0 0 22px; color: var(--muted); overflow-wrap: anywhere; }
  a.button { display: inline-block; padding: 10px 20px; border-radius: 8px; background: var(--accent);
             color: var(--on-accent); font-weight: 600; text-decoration: none; }
  a.fallback { display: block; margin-top: 18px; font-size: 14px; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">Opening in Obsidian…</h1>
  <p id="detail"></p>
  <a id="obsidian" class="button" hidden>Open in Obsidian</a>
  <a id="github" class="fallback" hidden>Open on GitHub</a>
  <noscript><p>This page needs JavaScript to open the note.</p></noscript>
</main>
<script>
  // Reads ?vault=…&file=…&gh=… and redirects to obsidian://open?vault=…&file=…
  // Nothing is stored or sent anywhere; the target is always an obsidian:// link built here.
  (function () {
    var params = new URLSearchParams(window.location.search);
    var vault = params.get("vault"), file = params.get("file"), gh = params.get("gh");

    var github = document.getElementById("github");
    try {  // the fallback link is only shown for a real https://github.com/ address
      var url = new URL(gh);
      if (url.protocol === "https:" && url.hostname === "github.com") {
        github.href = url.href;
        github.hidden = false;
      }
    } catch (e) { /* no or invalid gh parameter: no fallback link */ }

    if (!vault || !file) {
      document.getElementById("title").textContent = "Nothing to open";
      document.getElementById("detail").textContent = "This link is missing the vault or file parameter.";
      return;
    }

    var target = "obsidian://open?vault=" + encodeURIComponent(vault) + "&file=" + encodeURIComponent(file);
    var button = document.getElementById("obsidian");
    button.href = target;
    button.hidden = false;
    document.getElementById("detail").textContent = file;
    window.location.replace(target);
  })();
</script>
</body>
</html>
